# CI for dns-ha-agent, run by Woodpecker (ci.battlenet.internal).
#
# Forgejo Actions is deliberately disabled on the Forgejo instance this repo
# lives on (actions.ENABLED=false, by name — see the Battlenet infra repo's
# docs/k3s/forgejo.md §4). Woodpecker is the declared CI system instead, so
# this pipeline is Woodpecker-native syntax, not GitHub/Forgejo Actions —
# there is no `uses:`, no `runs-on`, and no job-output passing between
# steps. Shape (test -> PR smoke test / build+push+digest -> smoke test by
# digest) mirrors dns-ha-agent/BLUEPRINT.md §12's original intent exactly;
# only the execution engine changed.
#
# The Docker build/push steps need a real Docker daemon, which the agent's
# own container does not provide — `services.docker` runs one as a
# privileged sidecar (Woodpecker's standard DinD pattern), reachable at
# tcp://docker:2375 from every step below. This repo must be marked
# "trusted" (privileged containers allowed) in Woodpecker's repo settings
# for the service to start.

services:
  docker:
    image: docker:24-dind
    privileged: true
    # Testcontainers and the production-image build pull public images through
    # this nested daemon.  The CI runner must not depend on the HA DNS edge it
    # is testing: a DNS-edge outage otherwise turns into misleading container
    # startup timeouts and blocks the very change meant to repair it.  These
    # scoped recursive resolvers are only for the disposable DinD service;
    # the runner host and deployed HA-DNS nodes keep their declared resolvers.
    #
    # NOT IN EFFECT as of 2026-09-05. Woodpecker's linter rejects this key --
    # "Additional property dns is not allowed", field services.docker, raised
    # as a warning on every run -- so it is dropped and the DinD service falls
    # back to the runner host's resolver. The independence the paragraph above
    # describes is therefore not actually being bought: a DNS-edge outage still
    # reaches CI. Left in place so the intent survives; it needs whatever
    # syntax this Woodpecker version accepts to apply for real.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      DOCKER_TLS_CERTDIR: ""

steps:
  test:
    image: eclipse-temurin:21-jdk-jammy
    environment:
      # Testcontainers integration tests use the same DinD service as the
      # image-build steps.  Woodpecker step containers do not have the
      # runner's Unix Docker socket, so without this explicit endpoint they
      # would either fail to start or be silently omitted from the CI gate.
      DOCKER_HOST: tcp://docker:2375
    commands:
      - cd dns-ha-agent
      - ./gradlew --no-daemon check integrationTest
    # A topic-branch update also creates a pull-request pipeline.  Run this
    # expensive DinD/Testcontainers suite in that PR pipeline only: running it
    # in both pipelines causes two complete container builds to contend for
    # the single runner and makes the required PR status flaky.  Main is
    # protected and receives this status before merge; manual runs retain an
    # operator-triggered diagnostic path.
    when:
      - event: [pull_request, manual]

  # PR-only: proves the image still builds and boots without needing
  # registry write access. Superseded by build-and-push + smoke-test on
  # main, which pull the real pushed image by digest instead of building
  # locally a second time.
  pr-smoke-test:
    image: docker:24-cli
    environment:
      DOCKER_HOST: tcp://docker:2375
    commands:
      # Woodpecker starts services and steps together; it does not wait for the
      # DinD daemon to be listening. Every docker-using step therefore waits
      # for it first. Without this the step races the daemon and fails with
      # "Cannot connect to the Docker daemon at tcp://docker:2375" -- which is
      # what main pushes did on 2026-09-05, immediately, three runs in a row.
      # The race is old; what changed is that Battlenet dropped the Zot sync
      # retries (its progress 0110) and step-image pulls went from ~15 minutes
      # to ~20 seconds, so steps now reach `docker` before the daemon is up.
      - 'for i in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 1; done; docker info >/dev/null'
      - cd dns-ha-agent
      - docker build --build-arg VCS_REF="$CI_COMMIT_SHA" -t dns-ha-agent:ci .
      - |
        cat > /tmp/ci-config.yaml <<'CFG'
        version: 1
        node: { name: ci-smoke, region: ci, vip: 192.0.2.53/32 }
        probe:
          target: 192.0.2.53
          resolve_names: [cloudflare.com]
          resolve_type: A
          block_name: dns-filter-sentinel.example
          block_expectation:
            mode: must_not_return_real_ip
            allowed_rcodes: [NXDOMAIN, REFUSED, NOERROR]
            allowed_ips: ["0.0.0.0"]
          interval: 2s
          query_timeout: 2s
          fail_threshold: 2
          success_threshold: 3
        peers: []
        split_brain: { enabled: false }
        tailscale:
          mode: noop
          cli_path: /usr/bin/tailscale
          managed_routes: [192.0.2.53/32]
          preserved_routes: []
          command_timeout: 10s
        http: { bind_address: 127.0.0.1, port: 8091 }
        logging: { format: JSON, level: INFO }
        metrics: { enabled: true, path: /metrics }
        CFG
      # The Docker CLI runs in a separate container from the DinD service, so
      # a CLI-side bind mount would point at a path the daemon cannot see.
      # Copying through the Docker API makes the config available on the
      # container actually launched by that daemon.
      - docker create --name ci-config-check dns-ha-agent:ci --check-config
      - docker cp /tmp/ci-config.yaml ci-config-check:/etc/dns-ha-agent/config.yaml
      - docker start -a ci-config-check | grep -q '"valid":true'
      - docker rm ci-config-check
      - docker create --name ci-route-plan dns-ha-agent:ci --plan-routes
      - docker cp /tmp/ci-config.yaml ci-route-plan:/etc/dns-ha-agent/config.yaml
      - docker start -a ci-route-plan | grep -q '"withdraw_routes":\[\]'
      - docker rm ci-route-plan
      - docker create --name ci-smoke -e DNS_HA_AGENT_ALLOW_NOOP_TAILSCALE=true dns-ha-agent:ci
      - docker cp /tmp/ci-config.yaml ci-smoke:/etc/dns-ha-agent/config.yaml
      - docker start ci-smoke
      - sleep 5
      - docker logs ci-smoke
      - docker exec ci-smoke wget -qO- http://127.0.0.1:8091/health | tee /tmp/ci-health.json
      - grep -q '"version"' /tmp/ci-health.json
      - docker exec ci-smoke wget -qO- http://127.0.0.1:8091/metrics | tee /tmp/ci-metrics.txt
      - grep -q '^dns_ha_agent_probe_total' /tmp/ci-metrics.txt
      - docker rm -f ci-smoke
    when:
      - event: pull_request

  build-and-push:
    image: docker:24-cli
    environment:
      DOCKER_HOST: tcp://docker:2375
      DOCKER_CLI_EXPERIMENTAL: enabled
      REGISTRY_USER:
        from_secret: forgejo_registry_user
      REGISTRY_TOKEN:
        from_secret: forgejo_registry_token
    commands:
      - 'for i in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 1; done; docker info >/dev/null'
      - apk add --no-cache jq
      # linux/arm64 target (Pi 5 edges) needs QEMU emulation when building
      # on an x86 runner (H1).
      - docker run --rm --privileged tonistiigi/binfmt --install all
      - echo "$REGISTRY_TOKEN" | docker login git.battlenet.internal -u "$REGISTRY_USER" --password-stdin
      # Deliberately NOT `docker buildx create` + `buildx build --platform
      # a,b --push` in one shot: that spins up a *separate* BuildKit
      # container (docker-container driver) which is created by the dind
      # daemon, not by Woodpecker itself, so it never gets the CA bundle
      # Woodpecker mounts into every container IT creates -- confirmed live
      # (docker login above succeeded; the buildx-created container's own
      # push failed with "certificate signed by unknown authority"). Building
      # per-arch with the default (daemon-embedded) driver and combining with
      # `docker manifest`, below, stays entirely inside containers Woodpecker
      # itself created, so the same CA trust that made `docker login` work
      # applies throughout.
      # Each build is tagged twice: the mutable :latest pointer and an
      # immutable $CI_COMMIT_SHA version tag. :latest is a browse pointer
      # ONLY; the version tag is the durable reference a consumer records so
      # its pin survives the next build overwriting :latest (the retention
      # GC'd the previously recorded digest because nothing referenced it).
      - docker build --build-arg VCS_REF="$CI_COMMIT_SHA" --platform linux/amd64 -f dns-ha-agent/Dockerfile -t git.battlenet.internal/liamp/dns-ha-agent:latest-amd64 -t git.battlenet.internal/liamp/dns-ha-agent:$CI_COMMIT_SHA-amd64 dns-ha-agent
      - docker push git.battlenet.internal/liamp/dns-ha-agent:latest-amd64
      - docker push git.battlenet.internal/liamp/dns-ha-agent:$CI_COMMIT_SHA-amd64
      - docker build --build-arg VCS_REF="$CI_COMMIT_SHA" --platform linux/arm64 -f dns-ha-agent/Dockerfile -t git.battlenet.internal/liamp/dns-ha-agent:latest-arm64 -t git.battlenet.internal/liamp/dns-ha-agent:$CI_COMMIT_SHA-arm64 dns-ha-agent
      - docker push git.battlenet.internal/liamp/dns-ha-agent:latest-arm64
      - docker push git.battlenet.internal/liamp/dns-ha-agent:$CI_COMMIT_SHA-arm64
      # :latest published as a convenience pointer ONLY. Ansible deploys pin
      # by digest (or the immutable $CI_COMMIT_SHA tag), not by :latest.
      - docker manifest create git.battlenet.internal/liamp/dns-ha-agent:latest git.battlenet.internal/liamp/dns-ha-agent:latest-amd64 git.battlenet.internal/liamp/dns-ha-agent:latest-arm64
      - docker manifest create git.battlenet.internal/liamp/dns-ha-agent:$CI_COMMIT_SHA git.battlenet.internal/liamp/dns-ha-agent:$CI_COMMIT_SHA-amd64 git.battlenet.internal/liamp/dns-ha-agent:$CI_COMMIT_SHA-arm64
      - docker manifest push git.battlenet.internal/liamp/dns-ha-agent:latest > /tmp/manifest-push.out
      - docker manifest push git.battlenet.internal/liamp/dns-ha-agent:$CI_COMMIT_SHA
      - cat /tmp/manifest-push.out
      - grep -o 'sha256:[a-f0-9]*' /tmp/manifest-push.out | head -1 > digest.txt
      - 'echo "Built digest: $(cat digest.txt)"'
    when:
      - event: [push, manual]
        branch: main

  smoke-test:
    image: docker:24-cli
    environment:
      DOCKER_HOST: tcp://docker:2375
      REGISTRY_USER:
        from_secret: forgejo_registry_user
      REGISTRY_TOKEN:
        from_secret: forgejo_registry_token
    commands:
      - 'for i in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 1; done; docker info >/dev/null'
      - apk add --no-cache wget jq
      # `docker login` writes credentials into this container's own
      # ~/.docker/config.json, not into the shared dind daemon -- found
      # live as "unauthorized" on pull, since build-and-push's login (a
      # different container) doesn't carry over. The registry image is
      # private, so every step that pulls or pushes needs its own login.
      - echo "$REGISTRY_TOKEN" | docker login git.battlenet.internal -u "$REGISTRY_USER" --password-stdin
      - |
        cat > test-config.yaml <<'EOF'
        version: 1
        node: { name: smoke, region: ci, vip: 192.0.2.53/32 }
        probe:
          target: 192.0.2.53
          resolve_names: [cloudflare.com]
          resolve_type: A
          block_name: dns-filter-sentinel.example
          block_expectation:
            mode: must_not_return_real_ip
            allowed_rcodes: [NXDOMAIN, REFUSED, NOERROR]
            allowed_ips: ["0.0.0.0"]
          interval: 2s
          query_timeout: 2s
          fail_threshold: 2
          success_threshold: 3
        peers: []
        split_brain: { enabled: false }
        tailscale:
          mode: noop
          cli_path: /usr/bin/tailscale
          managed_routes: [192.0.2.53/32]
          preserved_routes: []
          command_timeout: 10s
        http: { bind_address: 127.0.0.1, port: 8091 }
        logging: { format: JSON, level: INFO }
        metrics: { enabled: true, path: /metrics }
        EOF
      # Pull and smoke-test BY DIGEST, not :latest — proves the exact
      # artifact Ansible would pin to actually boots.
      #
      # Root cause of the empty-digest failures (found live, after ruling
      # out cross-step sharing and per-item shell isolation): Woodpecker's
      # own pipeline compiler substitutes ${VAR} in commands: strings at
      # compile time, from ITS template context (built-ins, `environment:`
      # values) -- not the shell's runtime state. `DIGEST` only ever exists
      # as a shell variable, so `${DIGEST}` was silently rewritten to an
      # empty string before the shell ever ran the line (confirmed: the
      # debug echo of $DIGEST via $(...) command substitution showed the
      # correct value, while the very next `${DIGEST}` in the same line was
      # already empty). `$DIGEST` (no braces) isn't Woodpecker's
      # substitution syntax, so the shell alone resolves it, at runtime, as
      # intended.
      - DIGEST=$(cat digest.txt) && IMAGE="git.battlenet.internal/liamp/dns-ha-agent@$DIGEST" && docker pull "$IMAGE" && docker run --rm --network none -v "$(pwd)/test-config.yaml:/etc/dns-ha-agent/config.yaml:ro" "$IMAGE" --check-config | grep -q '"valid":true' && docker run --rm --network none -v "$(pwd)/test-config.yaml:/etc/dns-ha-agent/config.yaml:ro" "$IMAGE" --plan-routes | grep -q '"withdraw_routes":\[\]' && docker run -d --name smoke --rm -e DNS_HA_AGENT_ALLOW_NOOP_TAILSCALE=true -v "$(pwd)/test-config.yaml:/etc/dns-ha-agent/config.yaml" "$IMAGE"
      - |
        status=1
        for i in $(seq 1 12); do
          sleep 2
          if docker exec smoke wget -qO- http://127.0.0.1:8091/health > /tmp/health.json; then
            status=0
            break
          fi
        done
        if [ "$status" -ne 0 ]; then
          echo "agent never became reachable on /health" >&2
          docker logs smoke || true
          docker stop smoke || true
          exit 1
        fi
      - jq . /tmp/health.json
      - grep -q '"version"' /tmp/health.json
      - docker stop smoke
    when:
      - event: [push, manual]
        branch: main

  # Mirrors the Forgejo-registry images into the dedicated Zot OCI registry
  # (registry.battlenet.internal). Re-tags the per-arch images already built
  # and pushed by build-and-push (same shared dind daemon), pushes them, and
  # publishes the multi-arch manifest list. Runs last so a Zot outage cannot
  # fail the canonical Forgejo publish + digest smoke-test.
  publish-zot:
    image: docker:24-cli
    environment:
      DOCKER_HOST: tcp://docker:2375
      ZOT_REGISTRY_USER:
        from_secret: zot_ci_username
      ZOT_REGISTRY_TOKEN:
        from_secret: zot_ci_password
    commands:
      - 'for i in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 1; done; docker info >/dev/null'
      - echo "$ZOT_REGISTRY_TOKEN" | docker login registry.battlenet.internal -u "$ZOT_REGISTRY_USER" --password-stdin
      # Same mutable :latest + immutable $CI_COMMIT_SHA tag scheme as the
      # Forgejo push; the version tag is the durable Zot reference too.
      - docker tag git.battlenet.internal/liamp/dns-ha-agent:$CI_COMMIT_SHA-amd64 registry.battlenet.internal/liamp/dns-ha-agent:latest-amd64
      - docker tag git.battlenet.internal/liamp/dns-ha-agent:$CI_COMMIT_SHA-amd64 registry.battlenet.internal/liamp/dns-ha-agent:$CI_COMMIT_SHA-amd64
      - docker push registry.battlenet.internal/liamp/dns-ha-agent:latest-amd64
      - docker push registry.battlenet.internal/liamp/dns-ha-agent:$CI_COMMIT_SHA-amd64
      - docker tag git.battlenet.internal/liamp/dns-ha-agent:$CI_COMMIT_SHA-arm64 registry.battlenet.internal/liamp/dns-ha-agent:latest-arm64
      - docker tag git.battlenet.internal/liamp/dns-ha-agent:$CI_COMMIT_SHA-arm64 registry.battlenet.internal/liamp/dns-ha-agent:$CI_COMMIT_SHA-arm64
      - docker push registry.battlenet.internal/liamp/dns-ha-agent:latest-arm64
      - docker push registry.battlenet.internal/liamp/dns-ha-agent:$CI_COMMIT_SHA-arm64
      - docker manifest create registry.battlenet.internal/liamp/dns-ha-agent:latest registry.battlenet.internal/liamp/dns-ha-agent:latest-amd64 registry.battlenet.internal/liamp/dns-ha-agent:latest-arm64
      - docker manifest create registry.battlenet.internal/liamp/dns-ha-agent:$CI_COMMIT_SHA registry.battlenet.internal/liamp/dns-ha-agent:$CI_COMMIT_SHA-amd64 registry.battlenet.internal/liamp/dns-ha-agent:$CI_COMMIT_SHA-arm64
      - docker manifest push registry.battlenet.internal/liamp/dns-ha-agent:latest
      - docker manifest push registry.battlenet.internal/liamp/dns-ha-agent:$CI_COMMIT_SHA
    when:
      - event: [push, manual]
        branch: main