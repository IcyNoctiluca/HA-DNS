# CI for dns-ha-agent, run by Woodpecker (ci.battlenet.l-p.dev).
#
# Forgejo Actions is deliberately disabled on the Forgejo instance this repo
# lives on (actions.ENABLED=false, by name — see the Battlenet infra repo's
# docs/k3s/forgejo.md §4). Woodpecker is the declared CI system instead, so
# this pipeline is Woodpecker-native syntax, not GitHub/Forgejo Actions —
# there is no `uses:`, no `runs-on`, and no job-output passing between
# steps. Shape (test -> PR smoke test / build+push+digest -> smoke test by
# digest) mirrors dns-ha-agent/BLUEPRINT.md §12's original intent exactly;
# only the execution engine changed.
#
# The Docker build/push steps need a real Docker daemon, which the agent's
# own container does not provide — `services.docker` runs one as a
# privileged sidecar (Woodpecker's standard DinD pattern), reachable at
# tcp://docker:2375 from every step below. This repo must be marked
# "trusted" (privileged containers allowed) in Woodpecker's repo settings
# for the service to start.

services:
  docker:
    image: docker:24-dind
    privileged: true
    # NO `dns:` OVERRIDE HERE, DELIBERATELY, AND IT MUST NOT COME BACK
    # WITHOUT SOLVING THE PROBLEM BELOW.
    #
    # Still true since the registry moved to registry.battlenet.l-p.dev: the
    # public zone holds no record for it -- only the rack's own resolvers
    # answer that name -- so a public recursive resolver still cannot find
    # the registry this pipeline publishes to. The account below names the
    # zone of the time.
    #
    # `ci: give DinD a bootstrap resolver` (e0486062, 2026-09-04) set
    # `dns: [1.1.1.1, 1.0.0.1]` on this service, so that CI would not depend on
    # the HA DNS edge it is testing. The intent is sound and the effect was
    # fatal: every main push since has failed. Public names resolved fine --
    # Alpine's CDN, Docker Hub, binfmt all pulled -- and then `docker login
    # git.battlenet.internal` died with
    #
    #     lookup git.battlenet.internal on 127.0.0.11:53: no such host
    #
    # because a public recursive resolver has never heard of the internal zone,
    # and this pipeline pushes every image it builds to a registry inside it.
    # A note added earlier the same day claiming the key was "not in effect"
    # was wrong: Woodpecker's linter does warn "Additional property dns is not
    # allowed", but it applies the key anyway. The warning is noise; the
    # override was real.
    #
    # With no override the daemon inherits the runner host's effective
    # resolvers, which answer BOTH the public internet and the internal zone --
    # verified on the runner: a plain container there resolves
    # git.battlenet.internal. That is also what worked for the months before
    # e0486062.
    #
    # If the independence is wanted back, it needs a resolver that can answer
    # the internal zone too. Note that hardcoding Battlenet's LAN resolver
    # addresses here would cross the repository boundary this project keeps
    # (Battlenet owns host and site facts, HA-DNS owns the agent), so the fix
    # belongs on the runner, not in this file.
    environment:
      DOCKER_TLS_CERTDIR: ""

steps:
  test:
    image: eclipse-temurin:21-jdk-jammy
    environment:
      # Testcontainers integration tests use the same DinD service as the
      # image-build steps.  Woodpecker step containers do not have the
      # runner's Unix Docker socket, so without this explicit endpoint they
      # would either fail to start or be silently omitted from the CI gate.
      DOCKER_HOST: tcp://docker:2375
    commands:
      - cd dns-ha-agent
      - ./gradlew --no-daemon check integrationTest
    # A topic-branch update also creates a pull-request pipeline.  Run this
    # expensive DinD/Testcontainers suite in that PR pipeline only: running it
    # in both pipelines causes two complete container builds to contend for
    # the single runner and makes the required PR status flaky.  Main is
    # protected and receives this status before merge; manual runs retain an
    # operator-triggered diagnostic path.
    when:
      - event: [pull_request, manual]

  # PR-only: proves the image still builds and boots without needing
  # registry write access. Superseded by publish + smoke-test on
  # main, which pull the real pushed image by digest instead of building
  # locally a second time.
  pr-smoke-test:
    image: docker:24-cli
    environment:
      DOCKER_HOST: tcp://docker:2375
    commands:
      # Woodpecker starts services and steps together; it does not wait for the
      # DinD daemon to be listening. Every docker-using step therefore waits
      # for it first. Without this the step races the daemon and fails with
      # "Cannot connect to the Docker daemon at tcp://docker:2375" -- which is
      # what main pushes did on 2026-09-05, immediately, three runs in a row.
      # The race is old; what changed is that Battlenet dropped the Zot sync
      # retries (its progress 0110) and step-image pulls went from ~15 minutes
      # to ~20 seconds, so steps now reach `docker` before the daemon is up.
      - 'for i in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 1; done; docker info >/dev/null'
      - cd dns-ha-agent
      - docker build --build-arg VCS_REF="$CI_COMMIT_SHA" -t dns-ha-agent:ci .
      - |
        cat > /tmp/ci-config.yaml <<'CFG'
        version: 1
        node: { name: ci-smoke, region: ci, vip: 192.0.2.53/32 }
        probe:
          target: 192.0.2.53
          resolve_names: [cloudflare.com]
          resolve_type: A
          block_name: dns-filter-sentinel.example
          block_expectation:
            mode: must_not_return_real_ip
            allowed_rcodes: [NXDOMAIN, REFUSED, NOERROR]
            allowed_ips: ["0.0.0.0"]
          interval: 2s
          query_timeout: 2s
          fail_threshold: 2
          success_threshold: 3
        peers: []
        split_brain: { enabled: false }
        tailscale:
          mode: noop
          cli_path: /usr/bin/tailscale
          managed_routes: [192.0.2.53/32]
          preserved_routes: []
          command_timeout: 10s
        http: { bind_address: 127.0.0.1, port: 8091 }
        logging: { format: JSON, level: INFO }
        metrics: { enabled: true, path: /metrics }
        CFG
      # The Docker CLI runs in a separate container from the DinD service, so
      # a CLI-side bind mount would point at a path the daemon cannot see.
      # Copying through the Docker API makes the config available on the
      # container actually launched by that daemon.
      - docker create --name ci-config-check dns-ha-agent:ci --check-config
      - docker cp /tmp/ci-config.yaml ci-config-check:/etc/dns-ha-agent/config.yaml
      - docker start -a ci-config-check | grep -q '"valid":true'
      - docker rm ci-config-check
      - docker create --name ci-route-plan dns-ha-agent:ci --plan-routes
      - docker cp /tmp/ci-config.yaml ci-route-plan:/etc/dns-ha-agent/config.yaml
      - docker start -a ci-route-plan | grep -q '"withdraw_routes":\[\]'
      - docker rm ci-route-plan
      - docker create --name ci-smoke -e DNS_HA_AGENT_ALLOW_NOOP_TAILSCALE=true dns-ha-agent:ci
      - docker cp /tmp/ci-config.yaml ci-smoke:/etc/dns-ha-agent/config.yaml
      - docker start ci-smoke
      - sleep 5
      - docker logs ci-smoke
      - docker exec ci-smoke wget -qO- http://127.0.0.1:8091/health | tee /tmp/ci-health.json
      - grep -q '"version"' /tmp/ci-health.json
      - docker exec ci-smoke wget -qO- http://127.0.0.1:8091/metrics | tee /tmp/ci-metrics.txt
      - grep -q '^dns_ha_agent_probe_total' /tmp/ci-metrics.txt
      - docker rm -f ci-smoke
    when:
      - event: pull_request

  # Builds each architecture once and publishes straight to Zot, the rack's
  # only container registry. Forgejo's package registry is retired (Battlenet
  # progress 0227); this step used to push there and a separate publish-zot
  # step re-tagged the same images into Zot. The three zot_* values are the
  # Woodpecker org secrets every first-party repository publishes with.
  #
  # Per-architecture builds with the daemon-embedded builder, combined with
  # `docker manifest`, rather than `buildx build --platform a,b --push`. That
  # was first forced by an internal-CA registry certificate a separate
  # BuildKit container never trusted; the certificate is public now, and the
  # shape is kept because it is proved. VCS_REF is what Battlenet's admission
  # checks: org.opencontainers.image.revision must equal the pinned revision.
  #
  # Each build is tagged twice: an immutable $CI_COMMIT_SHA version tag, which
  # is what a consumer records, and a mutable :latest browse pointer that
  # nothing may pin.
  #
  # $VAR, never ${VAR}: Woodpecker substitutes ${VAR} at compile time from its
  # own context, so a shell variable written with braces silently becomes an
  # empty string (see smoke-test below).
  publish:
    image: docker:24-cli
    environment:
      DOCKER_HOST: tcp://docker:2375
      DOCKER_CLI_EXPERIMENTAL: enabled
      IMAGE_REPO: liamp/dns-ha-agent
      ZOT_REGISTRY:
        from_secret: zot_push_registry
      ZOT_USER:
        from_secret: zot_ci_username
      ZOT_PASSWORD:
        from_secret: zot_ci_password
    commands:
      - 'for i in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 1; done; docker info >/dev/null'
      # linux/arm64 target (Pi 5 edges) needs QEMU emulation when building
      # on an x86 runner (H1).
      - docker run --rm --privileged tonistiigi/binfmt --install all
      - echo "$ZOT_PASSWORD" | docker login "$ZOT_REGISTRY" -u "$ZOT_USER" --password-stdin
      - |
        set -e
        REF="$ZOT_REGISTRY/$IMAGE_REPO"
        for arch in amd64 arm64; do
          docker build --build-arg VCS_REF="$CI_COMMIT_SHA" --platform "linux/$arch" -f dns-ha-agent/Dockerfile -t "$REF:$CI_COMMIT_SHA-$arch" -t "$REF:latest-$arch" dns-ha-agent
          docker push "$REF:$CI_COMMIT_SHA-$arch"
          docker push "$REF:latest-$arch"
        done
        # The immutable tag first: its digest is the release pointer.
        docker manifest create "$REF:$CI_COMMIT_SHA" "$REF:$CI_COMMIT_SHA-amd64" "$REF:$CI_COMMIT_SHA-arm64"
        docker manifest push "$REF:$CI_COMMIT_SHA" | tee /tmp/manifest-push.out
        grep -o 'sha256:[a-f0-9]*' /tmp/manifest-push.out | head -1 > digest.txt
        test -s digest.txt
        docker manifest create "$REF:latest" "$REF:latest-amd64" "$REF:latest-arm64"
        docker manifest push "$REF:latest"
        echo "Published $REF@$(cat digest.txt) (tags: $CI_COMMIT_SHA, latest)"
    when:
      - event: [push, manual]
        branch: main

  smoke-test:
    image: docker:24-cli
    environment:
      DOCKER_HOST: tcp://docker:2375
      IMAGE_REPO: liamp/dns-ha-agent
      ZOT_REGISTRY:
        from_secret: zot_push_registry
      ZOT_USER:
        from_secret: zot_ci_username
      ZOT_PASSWORD:
        from_secret: zot_ci_password
    commands:
      - 'for i in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 1; done; docker info >/dev/null'
      - apk add --no-cache wget jq
      # `docker login` writes credentials into this container's own
      # ~/.docker/config.json, not into the shared dind daemon -- found
      # live as "unauthorized" on pull, since the publish step's login (a
      # different container) doesn't carry over. Zot allows no anonymous
      # read, so every step that pulls or pushes needs its own login.
      - echo "$ZOT_PASSWORD" | docker login "$ZOT_REGISTRY" -u "$ZOT_USER" --password-stdin
      - |
        cat > test-config.yaml <<'EOF'
        version: 1
        node: { name: smoke, region: ci, vip: 192.0.2.53/32 }
        probe:
          target: 192.0.2.53
          resolve_names: [cloudflare.com]
          resolve_type: A
          block_name: dns-filter-sentinel.example
          block_expectation:
            mode: must_not_return_real_ip
            allowed_rcodes: [NXDOMAIN, REFUSED, NOERROR]
            allowed_ips: ["0.0.0.0"]
          interval: 2s
          query_timeout: 2s
          fail_threshold: 2
          success_threshold: 3
        peers: []
        split_brain: { enabled: false }
        tailscale:
          mode: noop
          cli_path: /usr/bin/tailscale
          managed_routes: [192.0.2.53/32]
          preserved_routes: []
          command_timeout: 10s
        http: { bind_address: 127.0.0.1, port: 8091 }
        logging: { format: JSON, level: INFO }
        metrics: { enabled: true, path: /metrics }
        EOF
      # Pull and smoke-test BY DIGEST, not :latest — proves the exact
      # artifact Ansible would pin to actually boots.
      #
      # Root cause of the empty-digest failures (found live, after ruling
      # out cross-step sharing and per-item shell isolation): Woodpecker's
      # own pipeline compiler substitutes ${VAR} in commands: strings at
      # compile time, from ITS template context (built-ins, `environment:`
      # values) -- not the shell's runtime state. `DIGEST` only ever exists
      # as a shell variable, so `${DIGEST}` was silently rewritten to an
      # empty string before the shell ever ran the line (confirmed: the
      # debug echo of $DIGEST via $(...) command substitution showed the
      # correct value, while the very next `${DIGEST}` in the same line was
      # already empty). `$DIGEST` (no braces) isn't Woodpecker's
      # substitution syntax, so the shell alone resolves it, at runtime, as
      # intended.
      - DIGEST=$(cat digest.txt) && IMAGE="$ZOT_REGISTRY/$IMAGE_REPO@$DIGEST" && docker pull "$IMAGE" && docker run --rm --network none -v "$(pwd)/test-config.yaml:/etc/dns-ha-agent/config.yaml:ro" "$IMAGE" --check-config | grep -q '"valid":true' && docker run --rm --network none -v "$(pwd)/test-config.yaml:/etc/dns-ha-agent/config.yaml:ro" "$IMAGE" --plan-routes | grep -q '"withdraw_routes":\[\]' && docker run -d --name smoke --rm -e DNS_HA_AGENT_ALLOW_NOOP_TAILSCALE=true -v "$(pwd)/test-config.yaml:/etc/dns-ha-agent/config.yaml" "$IMAGE"
      - |
        status=1
        for i in $(seq 1 12); do
          sleep 2
          if docker exec smoke wget -qO- http://127.0.0.1:8091/health > /tmp/health.json; then
            status=0
            break
          fi
        done
        if [ "$status" -ne 0 ]; then
          echo "agent never became reachable on /health" >&2
          docker logs smoke || true
          docker stop smoke || true
          exit 1
        fi
      - jq . /tmp/health.json
      - grep -q '"version"' /tmp/health.json
      - docker stop smoke
    when:
      - event: [push, manual]
        branch: main
