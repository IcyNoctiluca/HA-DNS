# Local-only build/verify harness. Not referenced by CI.
#
# Usage:
#   ./run-local-check.sh
# or directly:
#   docker compose -f docker-compose.local.yml run --rm check
#
# What it does:
#   1. Generates gradle/wrapper/gradle-wrapper.jar if missing (first run only —
#      it's committed after that, per the !gradle-wrapper.jar rule in .gitignore).
#   2. Runs `./gradlew --no-daemon check` — the exact command CI's `test` job
#      runs — and tees output to build/local-check.log (already gitignored)
#      so results can be read back from outside the container.
#
# `integrationTest` (Testcontainers) is a separate service below since it
# needs the host Docker socket; run it explicitly once `check` is green.

services:
  check:
    build:
      context: .
      dockerfile: Dockerfile.build
    volumes:
      - .:/workspace
      - gradle-cache:/root/.gradle
    working_dir: /workspace
    command: >
      bash -c "
        set -e &&
        mkdir -p build &&
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          echo '--- gradle-wrapper.jar missing, generating it ---' &&
          gradle wrapper --gradle-version 8.7 --no-daemon
        fi &&
        echo '--- running ./gradlew --no-daemon check ---' &&
        ./gradlew --no-daemon check 2>&1 | tee build/local-check.log
      "

  integration-test:
    build:
      context: .
      dockerfile: Dockerfile.build
    volumes:
      - .:/workspace
      - gradle-cache:/root/.gradle
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    command: >
      bash -c "
        set -e &&
        mkdir -p build &&
        echo '--- running ./gradlew --no-daemon integrationTest ---' &&
        ./gradlew --no-daemon integrationTest 2>&1 | tee build/local-integration-test.log
      "

volumes:
  gradle-cache:
