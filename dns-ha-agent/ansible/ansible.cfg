; Local config for the dns-ha-agent Ansible tree.
;
; Ansible's default role search path is <playbook_dir>/roles/. Our playbooks
; live in playbooks/ while the actual role lives in roles/ (both direct
; children of this ansible/ directory, matching BLUEPRINT.md's documented
; layout and its `ansible-playbook playbooks/dns-ha-agent.yml` invocation
; examples, which assume this directory as the working directory). Without
; this file, `ansible-playbook playbooks/dns-ha-agent.yml` fails with
; "the role 'dns-ha-agent' was not found" because Ansible looks in
; playbooks/roles/ instead of ../roles/ relative to the playbook.
;
; Discovered automatically by Ansible when the current working directory is
; this ansible/ directory (Ansible's config search order checks ./ansible.cfg
; before ~/.ansible.cfg or /etc/ansible/ansible.cfg) — i.e. exactly the
; working directory BLUEPRINT.md's own invocation examples assume.
[defaults]
roles_path = roles
