---
# dns-ha-agent role tasks. BLUEPRINT.md §14.
#
# Ordering matters: the two assert tasks run first and hard-fail the play
# before anything is written to disk or pulled, per PHASES.md Phase 6
# acceptance criterion "running the role with dns_ha_agent_image_digest=""
# fails with the assertion message."

- name: Assert image digest is pinned (no rolling :latest in production)
  assert:
    that:
      - dns_ha_agent_image_digest is defined
      - dns_ha_agent_image_digest | length > 0
      - dns_ha_agent_image_digest is match("^sha256:[a-f0-9]{64}$")
    fail_msg: >
      dns_ha_agent_image_digest must be set to a sha256:... digest. Read the
      current digest from the latest main-branch CI build output
      (image-digest artifact) — see ../../BLUEPRINT.md §12. Never set this to
      ":latest"; deployments must pin by digest for byte-identical rollback.
    success_msg: "dns_ha_agent_image_digest is pinned: {{ dns_ha_agent_image_digest }}"

- name: Assert filter sentinel is configured (must match Phase 0 setup)
  assert:
    that:
      - dns_ha_agent_filter_sentinel is defined
      - dns_ha_agent_filter_sentinel | length > 0
    fail_msg: >
      dns_ha_agent_filter_sentinel must be set to a real public DNS name
      that is blocked by AGH (see ../../PHASES.md Phase 0). Without this the
      agent cannot verify filtering is active and, per the fail-closed
      design (../../AGENTS.md), must not be deployed.

- name: Assert node region is set (required for peer-monitoring config)
  assert:
    that:
      - dns_ha_agent_node_region is defined
      - dns_ha_agent_node_region | length > 0
    fail_msg: >
      dns_ha_agent_node_region must be set in host_vars for this node
      (e.g. "eu"). See ../../BLUEPRINT.md §14 example host_vars.

- name: Ensure config directory exists
  file:
    path: "{{ dns_ha_agent_config_dir }}"
    state: directory
    mode: '0755'

- name: Ensure state directory exists
  file:
    path: "{{ dns_ha_agent_state_dir }}"
    state: directory
    mode: '0700'

- name: Render agent config
  template:
    src: config.yaml.j2
    dest: "{{ dns_ha_agent_config_dir }}/config.yaml"
    mode: '0644'
  notify: Restart dns-ha-agent

- name: Render docker-compose for agent (pinned by digest)
  template:
    src: docker-compose.yml.j2
    dest: "{{ dns_ha_agent_compose_dir }}/docker-compose.yml"
    mode: '0644'
  notify: Restart dns-ha-agent

- name: Pull pinned image by digest
  community.docker.docker_image:
    name: "{{ dns_ha_agent_image_repo }}@{{ dns_ha_agent_image_digest }}"
    source: pull
  notify: Restart dns-ha-agent

- name: Start dns-ha-agent
  community.docker.docker_compose_v2:
    project_src: "{{ dns_ha_agent_compose_dir }}"
    state: present
