---
galaxy_info:
  role_name: dns_ha_agent
  namespace: homelab
  description: >
    Deploys dns-ha-agent (see ../../BLUEPRINT.md and ../../AGENTS.md) as a
    digest-pinned Docker container on a DNS edge node. Refuses to run
    without a pinned image digest and a configured filter sentinel.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Requires the community.docker collection (docker_image, docker_compose_v2
# modules used in tasks/main.yml and handlers/main.yml). Install via:
#   ansible-galaxy collection install -r ansible/requirements.yml
dependencies: []
